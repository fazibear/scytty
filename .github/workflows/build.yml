name: Build

on:
  push:
    # Default-branch caches can be reused by future tags; tag caches cannot.
    branches: [main]
    tags:
      - '*'

permissions:
  contents: read

jobs:
  servers:
    name: Server ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: macos-x86_64
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-key: server-${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test and build server
        shell: bash
        run: |
          cargo test --locked -p scytty-server -p scytty-common
          if [[ '${{ runner.os }}' == Linux ]]; then
            host=$(rustc -vV | awk '/^host:/ {print $2}')
            export RUSTFLAGS="-C linker=$(rustc --print sysroot)/lib/rustlib/$host/bin/rust-lld -C linker-flavor=ld.lld"
          fi
          cargo build --locked --release -p scytty-server --target '${{ matrix.target }}'
          mkdir -p bundle dist package
          cp 'target/${{ matrix.target }}/release/scytty-server' package/scytty-server
          if [[ '${{ runner.os }}' == macOS ]]; then
            codesign --force --sign - package/scytty-server
          fi
          cp package/scytty-server 'bundle/scytty-server-${{ matrix.platform }}'
          tar -czf 'dist/scytty-server-${{ matrix.platform }}.tar.gz' -C package scytty-server
      - uses: actions/upload-artifact@v4
        with:
          name: server-bundle-${{ matrix.platform }}
          path: bundle/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: scytty-server-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  build:
    needs: servers
    name: Desktop ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      SCYTTY_SERVER_BUNDLE: ${{ github.workspace }}/server-bundle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: server-bundle-*
          path: server-bundle
          merge-multiple: true
      # Avoid the tarball host's certificate-chain failure on Windows.
      - uses: actions/checkout@v4
        if: runner.os == 'Windows'
        with:
          repository: ghostty-org/ghostty
          ref: vt-1.0.1
          path: .ghostty-source
          persist-credentials: false
      - name: Use pinned Ghostty checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "GHOSTTY_SOURCE_DIR=$env:GITHUB_WORKSPACE/.ghostty-source" >> $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-key: desktop-${{ matrix.platform }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify complete bundle
        shell: bash
        run: |
          for platform in linux-x86_64 linux-arm64 macos-arm64 macos-x86_64; do
            test -s "server-bundle/scytty-server-$platform"
          done
      - name: Build and test desktop
        run: |
          cargo test --locked -p scytty -p scytty-common -p scytty-server
          cargo build --locked --release -p scytty -p scytty-server
      - name: Package Windows desktop
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf dist/scytty-desktop-${{ matrix.platform }}.tar.gz -C target/release scytty.exe scytty-server.exe
      - name: Package macOS desktop
        if: runner.os == 'macOS'
        run: |
          app=dist/Scytty.app
          bash scripts/package-macos.sh target/release/scytty server-bundle/scytty-server-macos-arm64 "$app"
          tar -czf dist/scytty-desktop-${{ matrix.platform }}.tar.gz -C dist Scytty.app
          rm -rf "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: scytty-desktop-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [servers, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: scytty-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz --verify-tag --title "$TAG" --generate-notes
