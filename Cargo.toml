[workspace]
members = ["crates/gui", "crates/server", "crates/common"]
default-members = ["crates/gui", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-channel = "2.5"
base64 = "0.23"
bincode = "1.3"
flate2 = "1"
fontdb = "0.24"
ghostty-vt = { version = "=0.8.0", default-features = false, features = ["kitty-graphics"] }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
hmac = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
mlua = { version = "0.12", features = ["luajit", "vendored", "error-send"] }
notify-rust = "4.19"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSView", "NSResponder", "NSControl", "NSCell", "NSImage", "NSImageView", "NSProgressIndicator", "NSBox", "NSColor"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
png = "0.18"
portable-pty = "0.9"
raw-window-handle = { version = "0.6", features = ["std"] }
scytty-common = { path = "crates/common" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
winresource = { version = "0.1", default-features = false }
