[package]
name = "scytty"
version.workspace = true
edition.workspace = true
default-run = "scytty"

[dependencies]
mlua = { version = "0.11", features = ["luajit", "vendored", "error-send"] }
anyhow.workspace = true
fontdb = "0.23"
ghostty-vt.workspace = true
scytty-common.workspace = true
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = { version = "0.25", default-features = false }

[build-dependencies]
winresource = { version = "0.1", default-features = false }
