[package]
name = "scytty"
version.workspace = true
edition.workspace = true
default-run = "scytty"

[dependencies]
mlua = { version = "0.11", features = ["luajit", "vendored", "error-send"] }
anyhow.workspace = true
fontdb = "0.23"
ghostty-vt.workspace = true
scytty-common.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "clipboard", "wayland", "x11", "persistence"] }
